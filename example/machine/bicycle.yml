core:
  hostname: spum-cannon
  timezone: UTC
  kernels: [linux]
  ntp: true
locale:
  keyboard: us
  language: en_US.UTF-8
  encoding: UTF-8
boot:
  loader: systemd-boot
  uki: true
  removable: false
disks:
  - device: /dev/vda
    wipe: true
    table: gpt
    partitions:
      - mount: /boot
        fs: fat32
        size: 512MiB
        start: 1MiB
        flags: [boot, esp]
      - mount: /
        fs: ext4
        size: 29182MiB
swap:
  enabled: true
  algorithm: zstd
users:
  - name: spader
    sudo: true
    groups: [wheel]
packages:
  extra: [git, lsd]
network:
  mode: iso
pacman:
  mirrors:
    regions: [United States]
catalog:
  url: "git://192.168.0.211/bikeshop"
systemd:
  enable:
    - docker.service
    - sshd.service
